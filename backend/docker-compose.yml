# backend/docker-compose.yml

version: '3.8'

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: transcription_db
      POSTGRES_USER: transcription_user
      POSTGRES_PASSWORD: transcription_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - app_network

  listener_service:
    build:
      context: ./listener_service
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://transcription_user:transcription_pass@postgres:5432/transcription_db
      MEDIA_STORAGE_PATH: /app/media
      WHISPER_MODEL_SIZE: base
      WHISPER_DEVICE: cpu
      WHISPER_COMPUTE_TYPE: int8
      HUGGINGFACE_TOKEN: ${HUGGINGFACE_TOKEN:-}  # если нужно, можно передать через .env
    ports:
      - "8000:8000"
    volumes:
      - ./listener_service:/app
      - media_volume:/app/media  # если нужен общий доступ к медиа
    depends_on:
      - postgres
    networks:
      - app_network
    restart: unless-stopped

  review_service:
    build:
      context: ./review_service
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://transcription_user:transcription_pass@postgres:5432/transcription_db
      # Добавь другие переменные окружения, если нужны
    ports:
      - "8001:8000"  # предположим, что review слушает 8000 внутри контейнера
    volumes:
      - ./review_service:/app
    depends_on:
      - postgres
    networks:
      - app_network
    restart: unless-stopped

volumes:
  postgres_data:
  media_volume:  # для общего хранения медиа между сервисами (если нужно)

networks:
  app_network:
    driver: bridge